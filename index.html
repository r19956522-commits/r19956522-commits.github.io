<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جورچین · ساخت و اشتراک‌گذاری پاورپوینت / PDF</title>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        body {
            min-height: 100vh;
            background: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: #1a1f2a;
            padding: 40px 35px;
            border-radius: 28px;
            border: 1px solid #2f3748;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }
        h1 {
            color: #e8edf5;
            font-size: 2.6rem;
            text-align: center;
            font-weight: 300;
        }
        h1 span {
            color: #6c8cff;
            font-weight: 700;
        }
        .sub {
            color: #8892a8;
            text-align: center;
            margin-top: 6px;
            border-bottom: 1px solid #2c3445;
            padding-bottom: 18px;
        }
        .sub small {
            color: #6c8cff;
        }
        .form-group {
            margin: 25px 0 20px;
        }
        label {
            display: block;
            color: #bcc3d4;
            font-weight: 500;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            background: #10141d;
            border: 1px solid #2f3748;
            border-radius: 16px;
            color: #e8edf5;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            border-color: #6c8cff;
            box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.15);
        }
        .radio-group {
            display: flex;
            gap: 30px;
            margin: 15px 0 10px;
            justify-content: center;
        }
        .radio-group label {
            color: #e8edf5;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .radio-group input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #6c8cff;
            cursor: pointer;
        }
        .btn-group {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin: 18px 0 10px;
        }
        .btn {
            flex: 1;
            padding: 14px 10px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.25s;
            background: #2c3445;
            color: #bcc3d4;
            min-width: 120px;
        }
        .btn-primary {
            background: #6c8cff;
            color: #fff;
            box-shadow: 0 6px 18px rgba(108, 140, 255, 0.25);
        }
        .btn-primary:hover {
            background: #5a7ae6;
            transform: scale(1.02);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .btn-success {
            background: #34d399;
            color: #0b0e14;
        }
        .btn-success:hover {
            background: #2bc48a;
            transform: scale(1.02);
        }
        #status {
            margin-top: 16px;
            color: #6c8cff;
            text-align: center;
            min-height: 26px;
            font-weight: 400;
        }
        .share-section {
            margin-top: 20px;
            display: none;
            text-align: center;
            border-top: 1px solid #252d3d;
            padding-top: 20px;
        }
        .share-section p {
            color: #bcc3d4;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #5e6a82;
            font-size: 0.85rem;
            border-top: 1px solid #252d3d;
            padding-top: 20px;
        }
        .footer strong {
            color: #bcc3d4;
            font-weight: 600;
        }
        @media (max-width: 500px) {
            .container {
                padding: 25px 18px;
            }
            h1 {
                font-size: 2rem;
            }
            .radio-group {
                gap: 15px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>▎<span>جورچین</span></h1>
        <div class="sub">ساخت و اشتراک‌گذاری <small>پاورپوینت / PDF</small> · با یک موضوع</div>

        <div class="form-group">
            <label for="topic">موضوع ارائه را وارد کنید</label>
            <input type="text" id="topic" placeholder="مثلاً: هوش مصنوعی" value="تأثیر فناوری بر آموزش" />
        </div>

        <!-- انتخاب نوع فایل -->
        <div class="radio-group">
            <label><input type="radio" name="fileType" value="pptx" checked /> پاورپوینت (PPTX)</label>
            <label><input type="radio" name="fileType" value="pdf" /> PDF (همان اسلایدها)</label>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="buildBtn">⚡ ساخت و اشتراک‌گذاری</button>
        </div>
        <div id="status">✅ آماده‌ی ساخت ...</div>

        <!-- بخش اشتراک‌گذاری -->
        <div class="share-section" id="shareSection">
            <p>📤 فایل با موفقیت ساخته شد! برای اشتراک‌گذاری، دکمه‌ی زیر را بزنید.</p>
            <button class="btn btn-success" id="shareBtn">📨 اشتراک‌گذاری با برنامه‌ها</button>
        </div>

        <div class="footer">
            <strong>مهندس یزدیان</strong> · بنیان‌گذار جورچین
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            const topicInput = document.getElementById('topic');
            const statusDiv = document.getElementById('status');
            const buildBtn = document.getElementById('buildBtn');
            const shareBtn = document.getElementById('shareBtn');
            const shareSection = document.getElementById('shareSection');
            const fileTypeRadios = document.querySelectorAll('input[name="fileType"]');

            let generatedFile = null;
            let generatedFileName = '';

            function setStatus(msg, isError = false) {
                statusDiv.textContent = msg;
                statusDiv.style.color = isError ? '#ff7a7a' : '#6c8cff';
            }

            // ---- ساخت محتوای اسلایدها (مشترک بین PPT و PDF) ----
            function generateSlideContent(topic) {
                const slides = [];
                // اسلاید ۱: عنوان
                slides.push({
                    title: '▎جورچین',
                    body: `${topic || 'ارائه‌ی بدون عنوان'}`,
                    footer: 'تولید شده توسط سامانه‌ی جورچین · ۳۰ اسلاید'
                });
                // اسلاید ۲: فهرست
                const sections = ['مقدمه', 'تعاریف', 'داده‌ها', 'تحلیل', 'نمودارها', 'چالش‌ها', 'راه‌کارها', 'پیش‌بینی',
                    'نتیجه‌گیری', 'تقدیر'
                ];
                let toc = '';
                sections.forEach((s, i) => { toc += `${i+1}. ${s}\n`; });
                slides.push({
                    title: 'فهرست مطالب',
                    body: toc,
                    footer: 'اسلاید ۲ از ۳۰'
                });

                // اسلایدهای ۳ تا ۲۹ (۲۷ اسلاید محتوایی)
                const titles = [
                    'مقدمه‌ای بر موضوع', 'تاریخچه', 'اهمیت', 'تعاریف پایه', 'ابعاد مختلف',
                    'نگاه آماری', 'منابع معتبر', 'سوالات اساسی', 'چارچوب نظری', 'روش‌شناسی',
                    'داده‌های اولیه', 'نمودار رشد', 'مقایسه گروه‌ها', 'تحلیل پراکندگی', 'همبستگی',
                    'رگرسیون', 'تحلیل حساسیت', 'شاخص‌ها', 'داده‌های تجمعی', 'روندهای فصلی',
                    'پیش‌بینی آینده', 'ارزیابی ریسک', 'مدیریت تغییر', 'نوآوری', 'بهبود فرآیند',
                    'بازخورد', 'بهبود مستمر'
                ];
                for (let i = 0; i < 27; i++) {
                    const idx = i % titles.length;
                    const title = titles[idx];
                    const body =
                        `بررسی «${title}» در موضوع «${topic || 'بدون موضوع'}». این اسلاید شامل تحلیل و داده‌های مرتبط است.`;
                    slides.push({
                        title: title,
                        body: body,
                        footer: `اسلاید ${i+3} از ۳۰`
                    });
                }

                // اسلاید ۳۰: تقدیر
                slides.push({
                    title: 'تقدیر و احترام',
                    body: `این ارائه با ۳۰ اسلاید توسط سامانه‌ی «جورچین» تهیه شده است.\n\nموضوع: ${topic || 'بدون موضوع'}\n\nبنیان‌گذار و طراح اصلی:\nمهندس یزدیان`,
                    footer: 'اسلاید ۳۰ از ۳۰'
                });

                return slides;
            }

            // ---- ساخت پاورپوینت (PPTX) ----
            function buildPowerPoint(topic) {
                const slidesData = generateSlideContent(topic);
                const pptx = new PptxGenJS();
                pptx.defineLayout({ name: 'WIDE', width: 13.33, height: 7.5 });
                pptx.layout = 'WIDE';

                const bg = '1A1F2A',
                    txt = 'E8EDF5',
                    accent = '6C8CFF';

                for (let i = 0; i < slidesData.length; i++) {
                    const slide = pptx.addSlide();
                    slide.background = { color: bg };

                    // عنوان
                    slide.addText(slidesData[i].title, {
                        x: 0.5,
                        y: 0.3,
                        w: 12,
                        h: 1.2,
                        fontSize: (i === 0) ? 34 : 38,
                        color: accent,
                        align: 'right',
                        bold: (i === 0)
                    });

                    // متن اصلی
                    slide.addText(slidesData[i].body, {
                        x: 0.8,
                        y: (i === 0) ? 2.0 : 1.8,
                        w: 11.5,
                        h: (i === 0) ? 3.5 : 4.0,
                        fontSize: (i === 0) ? 46 : 24,
                        color: txt,
                        align: (i === 0) ? 'center' : 'right',
                        valign: (i === 0) ? 'middle' : 'top',
                        lineSpacing: (i === 0) ? 40 : 30,
                        bold: (i === 0)
                    });

                    // پاورقی
                    slide.addText(slidesData[i].footer, {
                        x: 0.5,
                        y: 6.9,
                        w: 12,
                        h: 0.5,
                        fontSize: 14,
                        color: '5E6A82',
                        align: 'left'
                    });
                }

                return pptx;
            }

            // ---- ساخت PDF (همان اسلایدها با تم دارک) ----
            function buildPDF(topic) {
                const slidesData = generateSlideContent(topic);
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('l', 'mm', 'a4'); // Landscape برای شبیه‌سازی اسلاید
                const pageW = 297;
                const pageH = 210;
                const margin = 20;

                for (let i = 0; i < slidesData.length; i++) {
                    if (i > 0) doc.addPage();

                    // پس‌زمینه‌ی تیره
                    doc.setFillColor(26, 31, 42); // #1A1F2A
                    doc.rect(0, 0, pageW, pageH, 'F');

                    // عنوان (با رنگ آبی)
                    doc.setFontSize((i === 0) ? 28 : 32);
                    doc.setTextColor(108, 140, 255); // #6C8CFF
                    doc.text(slidesData[i].title, pageW - margin, margin + 15, { align: 'right' });

                    // متن اصلی
                    doc.setFontSize((i === 0) ? 36 : 18);
                    doc.setTextColor(232, 237, 245); // #E8EDF5
                    const lines = doc.splitTextToSize(slidesData[i].body, pageW - 2 * margin - 20);
                    const startY = (i === 0) ? margin + 40 : margin + 30;
                    doc.text(lines, margin + 10, startY, {
                        align: (i === 0) ? 'center' : 'right',
                        maxWidth: pageW - 2 * margin - 20
                    });

                    // پاورقی
                    doc.setFontSize(12);
                    doc.setTextColor(94, 106, 130); // #5E6A82
                    doc.text(slidesData[i].footer, margin + 10, pageH - margin, { align: 'left' });
                }

                return doc;
            }

            // ---- ذخیره فایل در متغیر ----
            function storeFile(blob, fileName) {
                generatedFile = new File([blob], fileName, { type: blob.type });
                generatedFileName = fileName;
            }

            // ---- رویداد اصلی ساخت ----
            buildBtn.addEventListener('click', async function() {
                const topic = topicInput.value.trim() || 'ارائه‌ی بدون عنوان';
                const fileType = document.querySelector('input[name="fileType"]:checked').value;

                shareSection.style.display = 'none';
                setStatus('⏳ در حال ساخت فایل ... (لطفاً صبر کنید)');
                buildBtn.disabled = true;

                try {
                    let blob = null;
                    let fileName = '';

                    if (fileType === 'pptx') {
                        const pptx = buildPowerPoint(topic);
                        blob = await pptx.write({ outputType: 'blob' });
                        fileName = `جورچین_۳۰اسلاید_${topic.replace(/\s+/g, '_')}.pptx`;
                    } else { // pdf
                        const doc = buildPDF(topic);
                        blob = doc.output('blob');
                        fileName = `جورچین_۳۰اسلاید_${topic.replace(/\s+/g, '_')}.pdf`;
                    }

                    storeFile(blob, fileName);
                    shareSection.style.display = 'block';
                    setStatus(`✅ فایل ${fileType.toUpperCase()} با موفقیت ساخته شد! اکنون می‌توانید آن را به اشتراک بگذارید.`);

                } catch (err) {
                    console.error(err);
                    setStatus('❌ خطا در ساخت فایل: ' + err.message, true);
                } finally {
                    buildBtn.disabled = false;
                }
            });

            // ---- اشتراک‌گذاری ----
            shareBtn.addEventListener('click', function() {
                if (!generatedFile) {
                    setStatus('⚠️ ابتدا فایل را بسازید!', true);
                    return;
                }

                if (navigator.share && window.File) {
                    navigator.share({
                            title: 'فایل تولید شده توسط جورچین',
                            files: [generatedFile],
                        })
                        .then(() => {
                            setStatus('✅ فایل با موفقیت به اشتراک گذاشته شد!');
                        })
                        .catch((error) => {
                            if (error.name !== 'AbortError') {
                                console.error('خطا در اشتراک‌گذاری:', error);
                                setStatus('❌ خطا در اشتراک‌گذاری: ' + error.message, true);
                            } else {
                                setStatus('⏹️ اشتراک‌گذاری لغو شد.');
                            }
                        });
                } else {
                    setStatus('⚠️ مرورگر شما از اشتراک‌گذاری فایل پشتیبانی نمی‌کند. فایل به‌صورت خودکار دانلود می‌شود.',
                    true);
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(generatedFile);
                    link.download = generatedFileName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
                }
            });

            setStatus('✨ موضوع را وارد کنید، نوع فایل را انتخاب کنید و روی دکمه‌ی ساخت کلیک کنید.');
        })();
    </script>
</body>
                </html>
